[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "playcal"
version = "0.1.3"
description = "One toolkit for AI agents building games: a reliable edit-settle-verify loop, and bot playtests calibrated against real players."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Rızgar Ozan" }]
dependencies = ["jsonschema>=4.18"]
keywords = ["unity", "gamedev", "ai-agents", "mcp", "playtesting", "testing", "llm", "game-testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/RizgarOzan/playcal"
Issues = "https://github.com/RizgarOzan/playcal/issues"
Changelog = "https://github.com/RizgarOzan/playcal/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
playcal = "playcal.cli:main"

[project.entry-points."playcal.modules"]
ingest = "playcal.ingest:MODULE"
report = "playcal.report:MODULE"
loop = "playcal.loop:MODULE"
logs = "playcal.logs:MODULE"
checkpoint = "playcal.checkpoint:MODULE"
query = "playcal.query:MODULE"
snap = "playcal.snap:MODULE"
baseline = "playcal.baseline:MODULE"
tests = "playcal.testhist:MODULE"
lock = "playcal.lock:MODULE"
meta = "playcal.meta:MODULE"
doctor = "playcal.doctor:MODULE"
visual = "playcal.visual:MODULE"
calibrate = "playcal.calibrate:MODULE"
observe = "playcal.observe:MODULE"
playtest = "playcal.playtest:MODULE"
audio = "playcal.audio:MODULE"
replay = "playcal.replay:MODULE"
ui = "playcal.ui:MODULE"

[tool.hatch.build.targets.wheel]
packages = ["src/playcal"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "playcal/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
